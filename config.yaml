influxdb:
  org: 'XXX'
  bucket: 'XXX/autogen'
  measurement: 'XXX'
  url: "https://XXX"
  token: 'XXX'
  verify: false
  timeout: 900000

postgresql:
  host: "XXX"
  user: "XXX"
  password: "XXX"
  database: "XXX"
  port: 5432

movement:
  # Umbral para el módulo de aceleración (is_effective_by_time)
  accel_threshold: 0.2
  # Umbral para el módulo de giroscopio (is_effective_by_time)
  gyro_threshold: 60
  # Threshold de potencia en la banda de frecuencia Accel
  accel_power_threshold: 0.125
  # Threshold de potencia en la banda de frecuencia Gyro
  gyro_power_threshold: 1000
  # Banda de frecuencia para Welch (Hz)
  freq_band_min: 0.4
  freq_band_max: 1.6
  # Mínimo de picos dentro de un segmento de análisis ~ 7s 
  min_continuous_hits: 3
  # Frecuencia nominal de muestreo del sensor (Hz)
  sampling_rate: 47.0
  # Frecuencia de remuestreo para alinear la serie temporal (Hz)
  resample_hz: 100.0
  # Número de muestras por ventana de análisis
  window_size_samples: 256
  # Fracción mínima para aceptar la última ventana parcial
  min_window_fraction: 0.5
  # Duración mínima de un segmento efectivo tras el merge (s)
  min_effective_duration_sec: 6.0
  # Duración mínima de un periodo de gait bilateral (s)
  min_gait_duration_sec: 6.0

  gps_resample_seconds: 10
  gps_padding_seconds: 15
  gps_min_points: 2
  gps_min_distance_m: 3.0
  gps_min_speed_m_s: 0.2
  gps_max_speed_m_s: 3.0
